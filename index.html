<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EasyChat Discord 商業級聊天室</title>
  
  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- iOS & Android App Icons -->
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon.png">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- QRCode.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <!-- React & React DOM (UMD Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Export Helpers: SheetJS (XLSX), html2canvas, jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7);
    }

    .theme-cream {
      --bg-primary: #FAF8F5;
      --bg-secondary: #F3EFEA;
      --bg-tertiary: #E8E2D9;
      --bg-accent: #E1D9CD;
      --text-main: #332E2A;
      --text-muted: #786F66;
      --card-bg: rgba(255, 255, 255, 0.85);
      --border-color: #E2DACF;
    }

    .theme-dark {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --bg-accent: #383a40;
      --text-main: #f2f3f5;
      --text-muted: #949ba4;
      --card-bg: rgba(43, 45, 49, 0.9);
      --border-color: #1f2023;
    }

    .pulse-animation {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
  </style>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('ServiceWorker registered:', reg.scope))
          .catch(err => console.log('ServiceWorker registration failed:', err));
      });
    }
  </script>
</head>
<body class="theme-cream antialiased select-none overflow-hidden bg-[var(--bg-primary)] text-[var(--text-main)] transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    let firebaseAuth, firebaseDB;
    let authObj, dbObj;

    const DEFAULT_AVATARS = Array.from({ length: 20 }, (_, i) => 
      `https://api.dicebear.com/7.x/bottts/svg?seed=avatar_${i + 1}&backgroundColor=6366f1,ec4899,10b981,f59e0b,8b5cf6`
    );

    const PRESET_EMOJIS = ["😀", "😂", "😍", "🥳", "😎", "👍", "❤️", "🔥", "🎉", "✨", "🚀", "💡", "😭", "🙈", "🤝", "💯", "🙏", "🍕", "🎮", "🎵"];
    const PRESET_GIFS = [
      { name: "Dance", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdtY25vbjNwc3J4Nzhsc2U1bW10dHFwNnh4ZnBndzN1eGtxZXRveSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/blSTtZehjAZ8I/giphy.gif" },
      { name: "Party", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDRrbXZrbDZhZXhhNHYxOHl6a3EwdXAwNXNndjJ6cjhkYzFncnlyYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l3V0lsG3X72MrvAC4/giphy.gif" },
      { name: "Cat Vibe", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp1ZjAwaWtrZWd6OXN0dWhjcXB5OGdxdW4xZHpsbWF0NXBsNGQzZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/jpbnoe3UIa8TU8LM13/giphy.gif" },
      { name: "Popcorn", url: "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDVqbzV6YmI3dm8yODV3aHZhdHZrbm1iYXp1NmpxcDVxcWJhdDNwYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NipFetnQOuKhW/giphy.gif" }
    ];

    function App() {
      const [firebaseReady, setFirebaseReady] = useState(false);
      const [user, setUser] = useState(null);
      const [nickname, setNickname] = useState(localStorage.getItem('easychat_nickname') || '');
      const [userAvatar, setUserAvatar] = useState(localStorage.getItem('easychat_avatar') || DEFAULT_AVATARS[0]);

      const [roomCode, setRoomCode] = useState('');
      const [joinedRoom, setJoinedRoom] = useState(null);
      const [roomName, setRoomName] = useState('通用討論區');
      const [roomIcon, setRoomIcon] = useState('💬');
      const [activeTab, setActiveTab] = useState('chat');
      const [isDarkMode, setIsDarkMode] = useState(localStorage.getItem('easychat_dark') === 'true');
      const [isMobileDeviceView, setIsMobileDeviceView] = useState(window.innerWidth < 768);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      const [messages, setMessages] = useState([]);
      const [inputText, setInputText] = useState('');
      const [lastSaved, setLastSaved] = useState(null);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      const [showAvatarPicker, setShowAvatarPicker] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [toastMsg, setToastMsg] = useState('');

      const [playlist, setPlaylist] = useState([
        { id: 'dQw4w9WgXcQ', title: 'Rick Astley - Never Gonna Give You Up' },
        { id: 'L_LUpnjgPso', title: 'Official Lo-Fi Hip Hop Beats' }
      ]);
      const [currentSongIndex, setCurrentSongIndex] = useState(0);
      const [isShuffleMode, setIsShuffleMode] = useState(false);
      const [newYoutubeUrl, setNewYoutubeUrl] = useState('');

      const messagesEndRef = useRef(null);
      const qrCodeRef = useRef(null);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      useEffect(() => {
        async function initFirebase() {
          try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
            const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
            const { getDatabase, ref, push, onValue, set } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");

            const firebaseConfig = {
              apiKey: "AIzaSyAc2DCat3WPv-vXt2kl4vIVla6qzMrUDJw",
              authDomain: "easychat-c8050.firebaseapp.com",
              projectId: "easychat-c8050",
              storageBucket: "easychat-c8050.firebasestorage.app",
              messagingSenderId: "960061584785",
              appId: "1:960061584785:web:b9d8ba00a4daca9d319630",
              measurementId: "G-CRQLYL3FHE"
            };

            const app = initializeApp(firebaseConfig);
            authObj = getAuth(app);
            dbObj = getDatabase(app);

            firebaseAuth = { signInAnonymously, onAuthStateChanged };
            firebaseDB = { ref, push, onValue, set };

            onAuthStateChanged(authObj, (u) => {
              if (u) setUser(u);
              else signInAnonymously(authObj).catch(console.error);
            });

            setFirebaseReady(true);
          } catch (err) {
            console.error("Firebase init failed:", err);
          }
        }
        initFirebase();

        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        const params = new URLSearchParams(window.location.search);
        const initialRoom = params.get('room');
        if (initialRoom) {
          setRoomCode(initialRoom);
        }

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      useEffect(() => {
        if (isDarkMode) {
          document.body.classList.remove('theme-cream');
          document.body.classList.add('theme-dark');
        } else {
          document.body.classList.remove('theme-dark');
          document.body.classList.add('theme-cream');
        }
        localStorage.setItem('easychat_dark', isDarkMode);
      }, [isDarkMode]);

      useEffect(() => {
        if (!joinedRoom || !dbObj || !firebaseDB) return;

        const roomRef = firebaseDB.ref(dbObj, `rooms/${joinedRoom}/messages`);
        const metaRef = firebaseDB.ref(dbObj, `rooms/${joinedRoom}/metadata`);

        const unsubscribeMessages = firebaseDB.onValue(roomRef, (snapshot) => {
          const val = snapshot.val();
          if (val) {
            const list = Object.entries(val).map(([id, data]) => ({ id, ...data }));
            setMessages(list.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0)));
          } else {
            setMessages([]);
          }
          setLastSaved(new Date().toLocaleTimeString());
        });

        const unsubscribeMeta = firebaseDB.onValue(metaRef, (snapshot) => {
          const val = snapshot.val();
          if (val) {
            if (val.name) setRoomName(val.name);
            if (val.icon) setRoomIcon(val.icon);
          }
        });

        return () => {
          unsubscribeMessages();
          unsubscribeMeta();
        };
      }, [joinedRoom]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      useEffect(() => {
        if (showShareModal && qrCodeRef.current && joinedRoom) {
          const shareUrl = `${window.location.origin}${window.location.pathname}?room=${joinedRoom}`;
          qrCodeRef.current.innerHTML = '';
          if (window.QRCode) {
            new window.QRCode(qrCodeRef.current, {
              text: shareUrl,
              width: 180,
              height: 180,
              colorDark: isDarkMode ? "#ffffff" : "#332e2a",
              colorLight: isDarkMode ? "#1e1f22" : "#ffffff",
              correctLevel: window.QRCode.CorrectLevel.H
            });
          }
        }
      }, [showShareModal, joinedRoom, isDarkMode]);

      const handleJoinRoom = (e) => {
        e?.preventDefault();
        const code = roomCode.trim();
        if (!code) {
          triggerToast('請輸入3位數房間號碼');
          return;
        }
        if (!nickname.trim()) {
          triggerToast('請輸入您的聊天暱稱');
          return;
        }

        localStorage.setItem('easychat_nickname', nickname);
        localStorage.setItem('easychat_avatar', userAvatar);
        setJoinedRoom(code);
        triggerToast(`成功進入房間區 #${code}`);
      };

      const handleSendMessage = (content, type = 'text') => {
        if (!content.trim() || !joinedRoom || !dbObj) return;

        const roomRef = firebaseDB.ref(dbObj, `rooms/${joinedRoom}/messages`);
        firebaseDB.push(roomRef, {
          sender: nickname || '無名氏',
          avatar: userAvatar,
          content: content.trim(),
          type: type,
          timestamp: Date.now(),
          uid: user?.uid || 'anon'
        });

        if (type === 'text') setInputText('');
        setShowEmojiPicker(false);
      };

      const handleClearHistory = () => {
        if (!joinedRoom || !dbObj) return;
        if (confirm(`確定要清空房間 #${joinedRoom} 的所有歷史訊息嗎？`)) {
          const roomRef = firebaseDB.ref(dbObj, `rooms/${joinedRoom}/messages`);
          firebaseDB.set(roomRef, null);
          triggerToast('歷史訊息已成功清空');
        }
      };

      const handleUpdateRoomMeta = (newName, newIcon) => {
        if (!joinedRoom || !dbObj) return;
        const metaRef = firebaseDB.ref(dbObj, `rooms/${joinedRoom}/metadata`);
        firebaseDB.set(metaRef, {
          name: newName || roomName,
          icon: newIcon || roomIcon,
          updatedAt: Date.now()
        });
        triggerToast('房間資訊已更新！');
      };

      const handleAddYoutubeUrl = () => {
        if (!newYoutubeUrl.trim()) return;
        let videoId = '';
        try {
          if (newYoutubeUrl.includes('v=')) {
            videoId = newYoutubeUrl.split('v=')[1].split('&')[0];
          } else if (newYoutubeUrl.includes('youtu.be/')) {
            videoId = newYoutubeUrl.split('youtu.be/')[1].split('?')[0];
          }
        } catch(e){}

        if (videoId) {
          setPlaylist([...playlist, { id: videoId, title: `歌曲 #${playlist.length + 1}` }]);
          setNewYoutubeUrl('');
          triggerToast('已加入歌曲清單！');
        } else {
          triggerToast('請輸入有效的 Youtube 網址');
        }
      };

      const exportToExcel = () => {
        if (messages.length === 0) {
          triggerToast('目前尚無聊天紀錄');
          return;
        }
        const data = messages.map(m => ({
          '發送者': m.sender,
          '內容': m.content,
          '類型': m.type,
          '時間': new Date(m.timestamp).toLocaleString()
        }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ChatHistory");
        XLSX.writeFile(wb, `EasyChat_Room_${joinedRoom}.xlsx`);
        triggerToast('Excel 匯出成功！');
      };

      const exportHighResPNG = async () => {
        const el = document.getElementById('chat-viewport');
        if (!el) return;
        try {
          triggerToast('正在生成 PNG 截圖...');
          const canvas = await html2canvas(el, { scale: 2, useCORS: true });
          const link = document.createElement('a');
          link.download = `EasyChat_Room_${joinedRoom}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          triggerToast('PNG 下載完成！');
        } catch(e) {
          triggerToast('PNG 生成失敗');
        }
      };

      const exportPDFReport = async () => {
        const el = document.getElementById('chat-viewport');
        if (!el) return;
        try {
          triggerToast('正在生成 PDF...');
          const canvas = await html2canvas(el, { scale: 2, useCORS: true });
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const imgWidth = 210;
          const imgHeight = (canvas.height * imgWidth) / canvas.width;
          pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, imgHeight);
          pdf.save(`EasyChat_Report_${joinedRoom}.pdf`);
          triggerToast('PDF 下載完成！');
        } catch(e) {
          triggerToast('PDF 生成失敗');
        }
      };

      const handleHardUpdate = () => {
        if (confirm('是否確認強制清除快取並重新載入？')) {
          if ('caches' in window) {
            caches.keys().then(names => names.forEach(name => caches.delete(name)));
          }
          localStorage.clear();
          sessionStorage.clear();
          window.location.reload(true);
        }
      };

      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${joinedRoom}`;

      if (!joinedRoom) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#F5EFE6] via-[#E8DFD8] to-[#DCD0C7] dark:from-[#1e1f22] dark:via-[#2b2d31] dark:to-[#111214]">
            <div className="max-w-md w-full bg-white/90 dark:bg-[#2b2d31]/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-white/50 dark:border-gray-700/50">
              <div className="text-center mb-6">
                <div className="inline-flex items-center justify-center w-20 h-20 bg-indigo-500 text-white rounded-3xl shadow-lg mb-4 text-4xl">
                  <i className="fa-brands fa-discord"></i>
                </div>
                <h1 className="text-3xl font-extrabold text-gray-800 dark:text-white">EasyChat 專業聊天室</h1>
                <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">商業級跨平台即時同步</p>
              </div>

              <form onSubmit={handleJoinRoom} className="space-y-5">
                <div>
                  <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-2">選擇個人頭像</label>
                  <div className="flex items-center gap-4 bg-gray-50 dark:bg-[#1e1f22] p-3 rounded-2xl border border-gray-200 dark:border-gray-700">
                    <img src={userAvatar} className="w-14 h-14 rounded-2xl border-2 border-indigo-500 object-cover bg-white" alt="Avatar" />
                    <button 
                      type="button" 
                      onClick={() => setShowAvatarPicker(!showAvatarPicker)}
                      className="px-4 py-2 bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 font-semibold text-xs rounded-xl hover:bg-indigo-100 transition"
                    >
                      <i className="fa-solid fa-palette mr-1"></i> 更換頭像 (20+ 款)
                    </button>
                  </div>
                </div>

                {showAvatarPicker && (
                  <div className="p-4 bg-gray-100 dark:bg-[#1e1f22] rounded-2xl border border-gray-300 dark:border-gray-700 max-h-48 overflow-y-auto grid grid-cols-5 gap-2">
                    {DEFAULT_AVATARS.map((url, idx) => (
                      <img 
                        key={idx} 
                        src={url} 
                        onClick={() => { setUserAvatar(url); setShowAvatarPicker(false); }}
                        className={`w-12 h-12 rounded-xl cursor-pointer hover:scale-110 transition border-2 ${userAvatar === url ? 'border-indigo-600 scale-105' : 'border-transparent'}`}
                      />
                    ))}
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-2">使用者暱稱</label>
                  <div className="relative">
                    <i className="fa-solid fa-user absolute left-4 top-3.5 text-gray-400"></i>
                    <input 
                      type="text" 
                      required
                      placeholder="輸入您的顯示暱稱..."
                      value={nickname}
                      onChange={(e) => setNickname(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-[#1e1f22] border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-gray-600 dark:text-gray-300 uppercase mb-2">房間號碼 (例如: 101)</label>
                  <div className="relative">
                    <i className="fa-solid fa-hashtag absolute left-4 top-3.5 text-gray-400"></i>
                    <input 
                      type="text" 
                      required
                      maxLength="4"
                      placeholder="三個數字房間號碼..."
                      value={roomCode}
                      onChange={(e) => setRoomCode(e.target.value)}
                      className="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-[#1e1f22] border border-gray-200 dark:border-gray-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white font-mono font-bold"
                    />
                  </div>
                </div>

                <button 
                  type="submit" 
                  className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2"
                >
                  <span>立即進入對話區</span>
                  <i className="fa-solid fa-arrow-right"></i>
                </button>
              </form>

              <div className="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700 flex items-center justify-between text-xs text-gray-500">
                <span className="flex items-center gap-1.5">
                  <span className={`w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-rose-500'}`}></span>
                  {isOnline ? '連線正常' : '離線模式'}
                </span>
                <button onClick={handleHardUpdate} className="text-gray-400 hover:text-indigo-500 underline">
                  <i className="fa-solid fa-arrows-rotate mr-1"></i>重置快取
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className={`flex h-screen w-screen overflow-hidden ${isMobileDeviceView ? 'max-w-md mx-auto shadow-2xl border-x border-gray-300' : ''}`}>
          {toastMsg && (
            <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 animate-bounce text-sm font-semibold">
              <i className="fa-solid fa-circle-check text-emerald-300 text-lg"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Left Icon Rail */}
          <div className="w-16 bg-[#EFE8DF] dark:bg-[#1e1f22] flex flex-col items-center py-4 gap-4 border-r border-[var(--border-color)] z-20 shrink-0">
            <div 
              onClick={() => setActiveTab('chat')} 
              className={`w-12 h-12 rounded-2xl flex items-center justify-center cursor-pointer transition-all ${activeTab === 'chat' ? 'bg-indigo-600 text-white rounded-xl shadow-lg' : 'bg-white/60 dark:bg-gray-800 text-gray-600 dark:text-gray-300'}`}
              title="聊天主視窗"
            >
              <i className="fa-solid fa-comments text-xl"></i>
            </div>
            <div 
              onClick={() => setActiveTab('dj')} 
              className={`w-12 h-12 rounded-2xl flex items-center justify-center cursor-pointer transition-all ${activeTab === 'dj' ? 'bg-indigo-600 text-white rounded-xl shadow-lg' : 'bg-white/60 dark:bg-gray-800 text-gray-600 dark:text-gray-300'}`}
              title="派對 DJ"
            >
              <i className="fa-solid fa-compact-disc text-xl"></i>
            </div>
            <div 
              onClick={() => setActiveTab('analytics')} 
              className={`w-12 h-12 rounded-2xl flex items-center justify-center cursor-pointer transition-all ${activeTab === 'analytics' ? 'bg-indigo-600 text-white rounded-xl shadow-lg' : 'bg-white/60 dark:bg-gray-800 text-gray-600 dark:text-gray-300'}`}
              title="分析中心"
            >
              <i className="fa-solid fa-chart-pie text-xl"></i>
            </div>

            <div className="mt-auto flex flex-col gap-3 items-center">
              <button 
                onClick={() => setIsDarkMode(!isDarkMode)} 
                className="w-10 h-10 rounded-xl bg-white/60 dark:bg-gray-800 text-amber-500 dark:text-yellow-300 flex items-center justify-center"
              >
                <i className={`fa-solid ${isDarkMode ? 'fa-sun' : 'fa-moon'} text-lg`}></i>
              </button>
              <button 
                onClick={() => setIsMobileDeviceView(!isMobileDeviceView)} 
                className={`w-10 h-10 rounded-xl flex items-center justify-center ${isMobileDeviceView ? 'bg-indigo-600 text-white' : 'bg-white/60 dark:bg-gray-800 text-gray-600 dark:text-gray-300'}`}
              >
                <i className="fa-solid fa-mobile-screen-button text-lg"></i>
              </button>
              <button 
                onClick={() => setJoinedRoom(null)} 
                className="w-10 h-10 rounded-xl bg-rose-100 text-rose-600 flex items-center justify-center"
              >
                <i className="fa-solid fa-door-open text-lg"></i>
              </button>
            </div>
          </div>

          {/* Sub Sidebar */}
          {!sidebarCollapsed && (
            <div className="w-56 bg-[var(--bg-secondary)] border-r border-[var(--border-color)] flex flex-col shrink-0 hidden md:flex">
              <div className="p-4 border-b border-[var(--border-color)] flex items-center justify-between">
                <div className="flex items-center gap-2 overflow-hidden">
                  <span 
                    className="text-2xl cursor-pointer" 
                    onDoubleClick={() => {
                      const icon = prompt('輸入新圖示 (Emoji):', roomIcon);
                      if (icon) handleUpdateRoomMeta(roomName, icon);
                    }}
                  >
                    {roomIcon}
                  </span>
                  <div>
                    <h2 
                      className="font-bold text-sm truncate cursor-pointer hover:underline"
                      onDoubleClick={() => {
                        const name = prompt('修改房間名稱:', roomName);
                        if (name) handleUpdateRoomMeta(name, roomIcon);
                      }}
                    >
                      {roomName}
                    </h2>
                    <p className="text-xs text-[var(--text-muted)] font-mono">#{joinedRoom}</p>
                  </div>
                </div>
              </div>

              <div className="p-3 space-y-1 overflow-y-auto flex-1">
                <div className="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider px-2 py-1">文字頻道</div>
                <div className="flex items-center gap-2 px-3 py-2 rounded-xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-bold text-sm">
                  <i className="fa-solid fa-hashtag"></i>
                  <span>大堂討論區</span>
                </div>
              </div>

              <div className="p-3 bg-[var(--bg-tertiary)] border-t border-[var(--border-color)] flex items-center">
                <div className="flex items-center gap-2.5 overflow-hidden">
                  <img src={userAvatar} className="w-9 h-9 rounded-xl border border-indigo-500 bg-white object-cover shrink-0" alt="me" />
                  <div className="truncate">
                    <p className="text-xs font-bold truncate">{nickname}</p>
                    <p className="text-[10px] text-emerald-500 font-semibold flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span> 線上
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col bg-[var(--bg-primary)] overflow-hidden relative">
            <header className="h-16 px-4 bg-[var(--bg-secondary)] border-b border-[var(--border-color)] flex items-center justify-between z-10 shrink-0">
              <div className="flex items-center gap-3">
                <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="hidden md:block text-gray-500">
                  <i className="fa-solid fa-bars text-lg"></i>
                </button>
                <div className="flex items-center gap-2">
                  <span className="text-xl">{roomIcon}</span>
                  <h3 className="font-bold text-base">{roomName}</h3>
                  <span className="bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 text-xs font-mono font-bold px-2.5 py-1 rounded-full">
                    #{joinedRoom}
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setShowShareModal(true)}
                  className="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2 pulse-animation"
                >
                  <i className="fa-solid fa-qrcode text-sm"></i>
                  <span>邀請連結 / QR Code</span>
                </button>

                <button onClick={handleClearHistory} className="p-2 text-rose-500 hover:bg-rose-50 rounded-xl" title="清空歷史">
                  <i className="fa-solid fa-trash-can"></i>
                </button>
                <button onClick={exportHighResPNG} className="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-200 rounded-xl text-xs font-semibold" title="PNG">
                  <i className="fa-solid fa-file-image"></i>
                </button>
                <button onClick={exportPDFReport} className="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-200 rounded-xl text-xs font-semibold" title="PDF">
                  <i className="fa-solid fa-file-pdf"></i>
                </button>
                <button onClick={exportToExcel} className="p-2 text-emerald-600 hover:bg-emerald-50 rounded-xl text-xs font-semibold" title="Excel">
                  <i className="fa-solid fa-file-excel"></i>
                </button>
              </div>
            </header>

            {activeTab === 'chat' && (
              <div className="flex-1 flex flex-col justify-between overflow-hidden relative">
                <div id="chat-viewport" className="flex-1 overflow-y-auto p-4 space-y-4">
                  <div className="bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 rounded-2xl p-4 text-center max-w-md mx-auto my-4">
                    <span className="text-3xl">{roomIcon}</span>
                    <h4 className="font-bold text-base mt-1">歡迎來到 {roomName}！</h4>
                    <p className="text-xs text-[var(--text-muted)] mt-1">房間 #{joinedRoom} 已同步連線。</p>
                  </div>

                  {messages.map((m) => (
                    <div key={m.id} className="flex items-start gap-3 group hover:bg-black/5 dark:hover:bg-white/5 p-2 rounded-2xl transition">
                      <img src={m.avatar || DEFAULT_AVATARS[0]} className="w-10 h-10 rounded-2xl bg-white border border-gray-200 dark:border-gray-700 object-cover shrink-0" />
                      <div className="flex-1 overflow-hidden">
                        <div className="flex items-baseline gap-2">
                          <span className="font-bold text-sm">{m.sender}</span>
                          <span className="text-[10px] text-[var(--text-muted)]">
                            {new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                          </span>
                        </div>
                        {m.type === 'image' || m.type === 'gif' ? (
                          <img src={m.content} className="mt-2 max-w-xs max-h-60 rounded-2xl object-cover shadow-sm" />
                        ) : (
                          <p className="text-sm mt-0.5 whitespace-pre-wrap break-words">{m.content}</p>
                        )}
                      </div>
                    </div>
                  ))}
                  <div ref={messagesEndRef} />
                </div>

                {showEmojiPicker && (
                  <div className="absolute bottom-20 left-4 z-30 bg-white dark:bg-[#2b2d31] border border-gray-200 dark:border-gray-700 rounded-3xl p-4 shadow-2xl w-80">
                    <div className="text-xs font-bold text-gray-500 uppercase mb-2">表情符號 (Emojis)</div>
                    <div className="grid grid-cols-5 gap-2 mb-4">
                      {PRESET_EMOJIS.map((emoji, i) => (
                        <button key={i} onClick={() => handleSendMessage(emoji, 'text')} className="text-2xl hover:scale-125 transition p-1 text-center">
                          {emoji}
                        </button>
                      ))}
                    </div>
                    <div className="text-xs font-bold text-gray-500 uppercase mb-2">GIF 梗圖庫</div>
                    <div className="grid grid-cols-3 gap-2 max-h-40 overflow-y-auto">
                      {PRESET_GIFS.map((gif, i) => (
                        <img key={i} src={gif.url} onClick={() => handleSendMessage(gif.url, 'gif')} className="w-full h-16 object-cover rounded-xl cursor-pointer" />
                      ))}
                    </div>
                  </div>
                )}

                <div className="p-4 bg-[var(--bg-secondary)] border-t border-[var(--border-color)]">
                  <div className="flex items-center gap-2 bg-[var(--bg-primary)] p-2 rounded-2xl border border-[var(--border-color)]">
                    <button onClick={() => setShowEmojiPicker(!showEmojiPicker)} className="p-2 text-amber-500 hover:bg-amber-100 rounded-xl text-lg">
                      <i className="fa-solid fa-face-smile"></i>
                    </button>
                    <input 
                      type="text" 
                      placeholder={`在 #${roomName} 發送訊息...`}
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendMessage(inputText, 'text')}
                      className="flex-1 bg-transparent text-sm focus:outline-none px-2 text-[var(--text-main)]"
                    />
                    <button onClick={() => handleSendMessage(inputText, 'text')} className="p-2.5 bg-indigo-600 text-white rounded-xl shadow-md">
                      <i className="fa-solid fa-paper-plane"></i>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'dj' && (
              <div className="flex-1 p-6 overflow-y-auto space-y-6">
                <div className="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-6 rounded-3xl shadow-xl flex items-center justify-between">
                  <div>
                    <h3 className="text-2xl font-black flex items-center gap-2">
                      <i className="fa-solid fa-compact-disc animate-spin"></i> 派對 DJ 播音室
                    </h3>
                    <p className="text-xs text-purple-200 mt-1">YouTube 播放清單</p>
                  </div>
                  <button 
                    onClick={() => setIsShuffleMode(!isShuffleMode)} 
                    className={`px-4 py-2 rounded-xl text-xs font-bold ${isShuffleMode ? 'bg-amber-400 text-gray-900' : 'bg-white/20 text-white'}`}
                  >
                    <i className="fa-solid fa-shuffle"></i> {isShuffleMode ? '隨機播放' : '依序播放'}
                  </button>
                </div>

                <div className="flex gap-3">
                  <input 
                    type="text" 
                    placeholder="貼上 Youtube 影片網址..."
                    value={newYoutubeUrl}
                    onChange={(e) => setNewYoutubeUrl(e.target.value)}
                    className="flex-1 px-4 py-3 bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-2xl text-sm focus:outline-none"
                  />
                  <button onClick={handleAddYoutubeUrl} className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-2xl shadow-md">
                    加入清單
                  </button>
                </div>

                {playlist.length > 0 && (
                  <div className="aspect-video w-full rounded-3xl overflow-hidden shadow-2xl border border-gray-200 dark:border-gray-700">
                    <iframe className="w-full h-full" src={`https://www.youtube.com/embed/${playlist[currentSongIndex]?.id}?autoplay=1`} allowFullScreen></iframe>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'analytics' && (
              <div className="flex-1 p-6 overflow-y-auto space-y-6">
                <h3 className="text-2xl font-black">📊 房間數據分析中心</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="p-5 bg-indigo-50 dark:bg-indigo-950/45 border border-indigo-200 rounded-3xl">
                    <p className="text-xs text-indigo-500 font-bold uppercase">總訊息數</p>
                    <p className="text-3xl font-black mt-1">{messages.length}</p>
                  </div>
                  <div className="p-5 bg-emerald-50 dark:bg-emerald-950/45 border border-emerald-200 rounded-3xl">
                    <p className="text-xs text-emerald-500 font-bold uppercase">圖片/GIF 數</p>
                    <p className="text-3xl font-black mt-1">{messages.filter(m => m.type !== 'text').length}</p>
                  </div>
                  <div className="p-5 bg-purple-50 dark:bg-purple-950/45 border border-purple-200 rounded-3xl">
                    <p className="text-xs text-purple-500 font-bold uppercase">上次同步時間</p>
                    <p className="text-lg font-bold mt-1">{lastSaved || '同步中...'}</p>
                  </div>
                </div>
              </div>
            )}
          </div>

          {showShareModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-[#2b2d31] rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center relative">
                <button onClick={() => setShowShareModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">
                  <i className="fa-solid fa-xmark text-xl"></i>
                </button>
                <h3 className="text-xl font-extrabold mb-1">邀請好友加入房間</h3>
                <p className="text-xs text-gray-500 dark:text-gray-400 mb-4">掃描 QR Code 或複製網址</p>

                <div className="bg-gray-100 dark:bg-[#1e1f22] p-4 rounded-2xl inline-block mb-4 shadow-inner">
                  <div ref={qrCodeRef} className="flex justify-center"></div>
                </div>

                <div className="flex items-center gap-2 bg-gray-50 dark:bg-[#1e1f22] p-2 rounded-2xl border border-gray-200 dark:border-gray-700 mb-4">
                  <input type="text" readOnly value={inviteUrl} className="flex-1 bg-transparent text-xs font-mono px-2 focus:outline-none" />
                  <button onClick={() => { navigator.clipboard.writeText(inviteUrl); triggerToast('已複製邀請連結！'); }} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">
                    複製
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
